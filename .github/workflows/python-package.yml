# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: Python package

on:
  push:
  pull_request:

jobs:
  build:

    runs-on: ${{ matrix.os }}
    timeout-minutes: 70  # Set the timeout value in minutes
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ github.ref == 'refs/heads/main' && fromJson('["3.11", "3.12", "3.13", "3.14", "3.15"]') || fromJson('["3.15"]') }}
        os: [ubuntu-latest, macOS-latest, windows-latest]
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    - name: Fetch full history and tags
      run: |
        git fetch --unshallow --tags || git fetch --tags
    - name: Install package and dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e '.[dev,docs]'
    - name: Run tests
      run: |
        python -m pytest -m "not plotter and not archive" -s
    - name: Build the package
      run: |
        pip install build
        python -m build
    - name: Verify bundled DR3 filter configurations
      shell: bash
      run: |
        python - <<'PYCODE'
        from pathlib import Path
        from tarfile import open as open_tar
        from zipfile import ZipFile

        source = Path('src/gaiaxpy/config/filters/dr3')
        expected = {p.relative_to('src').as_posix() for p in source.glob('*.yaml')}
        assert expected, 'No DR3 filter configurations found in source tree'

        wheel_paths = list(Path('dist').glob('*.whl'))
        sdist_paths = list(Path('dist').glob('*.tar.gz'))
        assert len(wheel_paths) == 1, f'Expected one wheel: {wheel_paths}'
        assert len(sdist_paths) == 1, f'Expected one sdist: {sdist_paths}'

        with ZipFile(wheel_paths[0]) as archive:
            wheel_names = set(archive.namelist())
        missing = sorted(expected - wheel_names)
        assert not missing, f'DR3 filter files missing from wheel: {missing}'

        with open_tar(sdist_paths[0], 'r:gz') as archive:
            sdist_names = {
                '/'.join(name.split('/')[1:])
                for name in archive.getnames()
            }
        missing = sorted({'src/' + path for path in expected} - sdist_names)
        assert not missing, f'DR3 filter files missing from sdist: {missing}'

        print(f'Verified {len(expected)} DR3 filter YAML files in wheel and sdist')
        PYCODE
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    - name: Build docs with Hatch
      run: hatch run docs:build
