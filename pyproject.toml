[build-system]
requires = ['hatchling', 'hatch-vcs']
build-backend = 'hatchling.build'

[project]
name = 'GaiaXPy'
dynamic = ['version']
description = 'Utilities to handle BP/RP (XP) Gaia low-resolution spectra as delivered via the Gaia Archive.'
readme = 'README.md'
requires-python = '>=3.11'
license = 'BSD-3-Clause'
license-files = ['LICENSE']
authors = [
    { name = 'Francesca De Angeli', email = 'fda@ast.cam.ac.uk' },
    { name = 'Daniela Ruz-Mieres', email = 'dr540@ast.cam.ac.uk' },
    { name = 'Paolo Montegriffo', email = 'paolo.montegriffo@inaf.it' },
    { name = 'Rene Andrae', email = 'andrae@mpia.de'},
    { name = 'Michele Bellazzini', email = 'michele.bellazzini@inaf.it' },
    { name = 'Lovro Palaversa', email = 'lp@irb.hr' }
]
maintainers = [
    { name = 'Daniela Ruz-Mieres', email = 'dr540@ast.cam.ac.uk' }
]
classifiers = [
    'Programming Language :: Python :: 3',
    'Operating System :: OS Independent'
]
dependencies = [
    'aenum',
    'astropy>=5.3.3,!=7.0.0,!=7.0.1',
    'astroquery',
    'fastavro',
    'hdfs',
    'joblib',
    'matplotlib',
    'numpy',
    'packaging',
    'pandas>=1.5.0',
    'scipy>=1.10',
    'tqdm>=4.66.3'
]

[project.optional-dependencies]
dev = [
    'pytest',
    'pytest-cov',
    'pytest-mock',
    'flake8',
    'openpyxl>=3.1'
]
docs = [
    'hatch',
    'sphinx',
    'sphinx-rtd-theme'
]

[tool.pytest.ini_options]
addopts = ""
testpaths = ['tests']
markers = [
    "archive: marks archive tests (deselect with '-m \"not archive\"')",
    "plotter: marks plotter tests (deselect with '-m \"not plotter\"')",
    "long: marks slow tests (deselect with '-m \"not long\"')"
]

# To build docs
[tool.hatch.envs.docs]
dependencies = []

[tool.hatch.envs.docs.scripts]
build = 'pip install -e .[docs] && sphinx-build docs docs/build'

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.version]
source = 'vcs'

[tool.hatch.version.raw-options]
version_scheme = "no-guess-dev"
local_scheme = "node-and-date"
fallback_version = "3.0.0.dev0"

[tool.hatch.build]
packages = ['src']

[tool.hatch.build.targets.sdist]
include = ['src/gaiaxpy']

[tool.hatch.build.targets.wheel]
packages = ['src/gaiaxpy']

[project.urls]
homepage = 'https://gaia-dpci.github.io/GaiaXPy-website/'
documentation = 'https://gaiaxpy.readthedocs.io/en/latest/'
